name: Feature request
description: Propose a bounded change aligned with the documented campaign-tool scope.
title: "Feature: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Describe how the proposal fits the current product and security boundaries, including the loopback-only DM entry and optional player HTTPS access. Identify any scope that needs separate design. Do not include private campaign content or proprietary third-party rules text.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What user-visible need does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest observable behavior change.
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Scope area
      options:
        - Released v1 behavior
        - SQLite campaign runtime and player participation
        - Draft SRD 5.1 character rules
        - Combat/conditions
        - Spells
        - Equipment/adventure
        - Monsters/magic items
        - Documentation/tooling
        - Out of current product scope
    validations:
      required: true
  - type: textarea
    id: contracts
    attributes:
      label: Contracts and boundaries to preserve
      description: Mention supported rule identities, migration history, file formats, DM/player access boundaries, or other invariants that matter.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
